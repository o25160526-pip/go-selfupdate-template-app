name: build-release-update-gate

on:
  push:
    branches: [main, 'release/**']
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.23.2'
  TZ: UTC
  APP_BINARY_NAME: app

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      display: ${{ steps.version.outputs.display }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v7
        with: {go-version: '${{ env.GO_VERSION }}', cache: true}
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          commit_time=$(git show -s --format=%cI HEAD)
          eval "$(go run ./cmd/versiongen --format both --time "$commit_time")"
          echo "display=$DISPLAY" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1}
      - uses: actions/setup-go@v7
        with: {go-version: '${{ env.GO_VERSION }}', cache: true}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'go.mod') }}-${{ hashFiles('**/*.go', 'scripts/*.sh') }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'go.mod') }}-
      - run: go test -race ./...
      - run: go vet ./...
      - run: sh ./scripts/audit-plan.sh
      - run: sh ./scripts/e2e-local.sh

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux, darwin]
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1}
      - uses: actions/setup-go@v7
        with: {go-version: '${{ env.GO_VERSION }}', cache: true}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('go.sum', 'go.mod') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('go.sum', 'go.mod') }}-
      - name: Build and sign target
        shell: bash
        env:
          APP_DISPLAY_VERSION: ${{ needs.version.outputs.display }}
          APP_CURRENT_PUBLIC_KEY: ${{ secrets.APP_CURRENT_PUBLIC_KEY }}
          APP_NEXT_PUBLIC_KEY: ${{ secrets.APP_NEXT_PUBLIC_KEY }}
          APP_BINARY_PRIVATE_KEY: ${{ secrets.APP_BINARY_PRIVATE_KEY }}
          APP_MANIFEST_PRIVATE_KEY: ${{ secrets.APP_MANIFEST_PRIVATE_KEY }}
          APP_MANIFEST_URL: ${{ vars.APP_MANIFEST_URL }}
        run: |
          set -euo pipefail
          . ./scripts/ci-keys.sh
          ext=''; [ '${{ matrix.os }}' != windows ] || ext='.exe'
          mkdir -p dist
          CGO_ENABLED=0 GOOS='${{ matrix.os }}' GOARCH='${{ matrix.arch }}' go build -trimpath \
            -ldflags "-s -w \
            -X github.com/your-org/go-selfupdate-template/internal/version.Display=${APP_DISPLAY_VERSION} \
            -X github.com/your-org/go-selfupdate-template/internal/version.Commit=${GITHUB_SHA} \
            -X github.com/your-org/go-selfupdate-template/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -X github.com/your-org/go-selfupdate-template/internal/buildinfo.CurrentPublicKey=${APP_CURRENT_PUBLIC_KEY} \
            -X github.com/your-org/go-selfupdate-template/internal/buildinfo.NextPublicKey=${APP_NEXT_PUBLIC_KEY} \
            -X github.com/your-org/go-selfupdate-template/internal/buildinfo.DefaultManifestURL=${APP_MANIFEST_URL} \
            -X github.com/your-org/go-selfupdate-template/internal/buildinfo.DefaultGitHubOwner=${GITHUB_REPOSITORY_OWNER} \
            -X github.com/your-org/go-selfupdate-template/internal/buildinfo.DefaultGitHubRepo=${GITHUB_REPOSITORY#*/}" \
            -o "dist/${APP_BINARY_NAME}_${{ matrix.os }}_${{ matrix.arch }}${ext}" ./cmd/app
          APP_BINARY_PRIVATE_KEY="${APP_BINARY_PRIVATE_KEY:-${APP_MANIFEST_PRIVATE_KEY:-}}" go run ./cmd/binarysign --file "dist/${APP_BINARY_NAME}_${{ matrix.os }}_${{ matrix.arch }}${ext}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_BINARY_NAME }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  draft:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    needs: [version, build]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1}
      - uses: actions/download-artifact@v8
        with: {path: dist, merge-multiple: true}
      - name: Create signed draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          DISPLAY: ${{ needs.version.outputs.display }}
          APP_BINARY_PRIVATE_KEY: ${{ secrets.APP_BINARY_PRIVATE_KEY }}
          APP_MANIFEST_PRIVATE_KEY: ${{ secrets.APP_MANIFEST_PRIVATE_KEY }}
          APP_CURRENT_PUBLIC_KEY: ${{ secrets.APP_CURRENT_PUBLIC_KEY }}
          APP_NEXT_PUBLIC_KEY: ${{ secrets.APP_NEXT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          . ./scripts/ci-keys.sh
          unsigned=$(find dist -type f ! -name '*.sig' | wc -l)
          signatures=$(find dist -type f -name '*.sig' | wc -l)
          test "$unsigned" -eq "$signatures"
          find dist -type f ! -name '*.sig' -print0 | sort -z | xargs -0 sha256sum > dist/checksums.txt
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" dist/* --draft --title "$DISPLAY" --generate-notes --verify-tag

  smoke-update:
    needs: [version, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            ext: ''
          - runner: windows-latest
            os: windows
            arch: amd64
            ext: '.exe'
          - runner: macos-14
            os: darwin
            arch: arm64
            ext: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Locate previous published release
        id: previous
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          current='${{ needs.version.outputs.tag }}'
          previous=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.draft == false and .tag_name != \"$current\") | .tag_name" | head -n1 || true)
          echo "tag=$previous" >> "$GITHUB_OUTPUT"
          if [ -n "$previous" ]; then echo "previous_tag=$previous" >> "$GITHUB_STEP_SUMMARY"; else echo "No published release exists yet. Running bootstrap verification." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/checkout@v7
        if: steps.previous.outputs.tag == ''
        with: {fetch-depth: 1}
      - uses: actions/setup-go@v7
        if: steps.previous.outputs.tag == ''
        with: {go-version: '${{ env.GO_VERSION }}', cache: true}
      - name: Wait for current draft assets
        if: steps.previous.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\")" 2>/dev/null || true)
            if [ -n "$release_json" ]; then
              count=$(printf '%s\n' "$release_json" | jq '.assets | length')
              draft=$(printf '%s\n' "$release_json" | jq -r '.draft')
              echo "draft asset count: $count (draft=$draft)"
              if [ "$draft" = true ] && [ "$count" -ge 12 ]; then exit 0; fi
            else echo "draft not visible yet"; fi
            sleep 2
          done
          exit 1
      - name: Bootstrap verification (first release)
        if: steps.previous.outputs.tag == ''
        shell: bash
        run: sh ./scripts/e2e-local.sh | tee "$RUNNER_TEMP/e2e-local-${{ matrix.os }}.log"
      - name: Download previous binary
        if: steps.previous.outputs.tag != ''
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir smoke
          asset='${{ env.APP_BINARY_NAME }}_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.ext }}'
          gh release download '${{ steps.previous.outputs.tag }}' --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir smoke
          test -s "smoke/$asset"
          mv "smoke/$asset" "smoke/app${{ matrix.ext }}"
          chmod +x "smoke/app${{ matrix.ext }}" || true
      - name: Upgrade draft and verify exact version
        if: steps.previous.outputs.tag != ''
        shell: bash
        env:
          APP_GITHUB_OWNER: ${{ github.repository_owner }}
          APP_GITHUB_REPO: ${{ github.event.repository.name }}
          APP_GITHUB_API: https://api.github.com
          APP_CHANNEL: internal
          APP_UPDATE_TOKEN: ${{ github.token }}
          APP_CACHE_DIR: ${{ runner.temp }}/app-cache
          APP_LOG_FILE: ${{ runner.temp }}/app-update.log
          APP_MANIFEST_URL: ''
        run: |
          set -euo pipefail
          bin='smoke/app${{ matrix.ext }}'
          old="$($bin version)"
          set +e
          "$bin" update --silent --channel internal --version '${{ needs.version.outputs.display }}' --timeout 5m 2>&1 | tee "$RUNNER_TEMP/update-output.log"
          status=${PIPESTATUS[0]}
          set -e
          cat "$APP_LOG_FILE" 2>/dev/null || true
          test "$status" -eq 0 || test "$status" -eq 10
          new="$($bin version)"
          test "$new" = '${{ needs.version.outputs.display }}'
          test "$old" != "$new"
          "$bin" rollback --target "$PWD/$bin"
          test "$($bin version)" = "$old"
          "$bin" update --silent --channel internal --version '${{ needs.version.outputs.display }}' --timeout 5m
          test "$($bin version)" = '${{ needs.version.outputs.display }}'

  promote:
    needs: [version, smoke-update]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1}
      - uses: actions/setup-go@v7
        with: {go-version: '${{ env.GO_VERSION }}', cache: true}
      - name: Sign policy manifest
        env:
          APP_MANIFEST_PRIVATE_KEY: ${{ secrets.APP_MANIFEST_PRIVATE_KEY }}
          DISPLAY: ${{ needs.version.outputs.display }}
        run: |
          set -euo pipefail
          . ./scripts/ci-keys.sh
          python3 - <<'PY'
          import json, os
          d=json.load(open('configs/manifest.example.json'))
          d['channels']['stable']['latest']=os.environ['DISPLAY']
          d['signature']=''
          json.dump(d,open('manifest.release.json','w'),indent=2)
          PY
          go run ./cmd/manifestsign --in manifest.release.json --out manifest.signed.json --key-id current
      - name: Attach manifest and publish draft
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh release upload '${{ needs.version.outputs.tag }}' manifest.signed.json --clobber
          gh release edit '${{ needs.version.outputs.tag }}' --draft=false

  post-verify:
    needs: [version, promote]
    runs-on: windows-latest
    steps:
      - name: Download the published Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          EXPECTED: ${{ needs.version.outputs.display }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force reports | Out-Null
          $asset = "${{ env.APP_BINARY_NAME }}_windows_amd64.exe"
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern $asset --dir reports
          $path = Join-Path reports $asset
          if (-not (Test-Path $path)) { throw "Published binary not found: $asset" }
          $version = (& $path version 2>&1 | Out-String).Trim()
          $status = $LASTEXITCODE
          @("release_tag=$env:TAG","asset=$asset","version=$version","exit_code=$status") | Set-Content reports/post-publish-$env:TAG.log
          if ($status -ne 0) { throw "Published binary exited with $status" }
          if ($version -ne $env:EXPECTED) { throw "Published version '$version' != expected '$env:EXPECTED'" }
          Get-Content reports/post-publish-$env:TAG.log | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
      - name: Stable self-update without token
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          EXPECTED: ${{ needs.version.outputs.display }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force reports, stable | Out-Null
          $log = "reports/post-publish-stable-$env:TAG.log"
          $previous = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft == false and .tag_name != \"$env:TAG\") | .tag_name" | Select-Object -First 1
          if (-not $previous) {
            "stable_self_update=skipped (no previous release)" | Add-Content $log
            Get-Content $log | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $asset = "${{ env.APP_BINARY_NAME }}_windows_amd64.exe"
          gh release download $previous --repo $env:GITHUB_REPOSITORY --pattern $asset --dir stable
          $path = Join-Path stable $asset
          if (-not (Test-Path $path)) { throw "Previous stable binary not found: $asset" }
          Remove-Item Env:APP_UPDATE_TOKEN -ErrorAction SilentlyContinue
          $env:APP_GITHUB_OWNER = '${{ github.repository_owner }}'
          $env:APP_GITHUB_REPO = '${{ github.event.repository.name }}'
          $env:APP_GITHUB_API = 'https://api.github.com'
          $env:APP_CHANNEL = 'stable'
          $env:APP_MANIFEST_URL = ''
          $env:APP_CACHE_DIR = "$env:RUNNER_TEMP\app-cache-stable"
          $env:APP_LOG_FILE = "$env:RUNNER_TEMP\app-update-stable.log"
          $old = (& $path version 2>&1 | Out-String).Trim()
          & $path update --silent --channel stable --version $env:EXPECTED --timeout 5m 2>&1 | Out-String | Write-Output
          $status = $LASTEXITCODE
          $new = (& $path version 2>&1 | Out-String).Trim()
          @("previous_tag=$previous","old=$old","new=$new","update_exit=$status","expected=$env:EXPECTED") | Set-Content $log
          Get-Content $env:APP_LOG_FILE -ErrorAction SilentlyContinue | Add-Content $log
          if ($status -ne 0 -and $status -ne 10) { throw "Stable self-update exited with $status" }
          if ($new -ne $env:EXPECTED) { throw "Stable self-update reached '$new' != expected '$env:EXPECTED'" }
          Get-Content $log | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: post-publish-verification-${{ needs.version.outputs.tag }}
          path: reports/post-publish-*
          if-no-files-found: error
